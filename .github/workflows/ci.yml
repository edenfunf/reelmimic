name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18', '24']
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Typecheck the harness (.claude/harness, same strict config)
        run: npx tsc -p ../.claude/harness/tsconfig.json
      - run: npm run lint
      - run: npm test
      - run: npm run build

  perception:
    name: Perception (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install numpy opencv-python-headless scipy librosa pillow pytest ruff
      - name: Lint every script (pyflakes rules, bugbear, simplify)
        working-directory: .claude/skills/video-clone/scripts
        run: ruff check . --select F,E9,B,UP,SIM --ignore UP006,UP035,SIM108,B905,UP038
      - run: python -m pytest .claude/skills/video-clone/scripts/tests -q

  harness:
    name: Harness (rules + hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Rules in step (CLAUDE.md ↔ AGENTS.md ↔ rules.mts ↔ policies ↔ docs/HARNESS.md)
        run: node --disable-warning=ExperimentalWarning .claude/harness/sync-rules.mts --check
      - name: Hook tests (shell parsing, policies, render detection, hooks end to end)
        run: node --disable-warning=ExperimentalWarning --test ".claude/harness/test/*.test.mts"
